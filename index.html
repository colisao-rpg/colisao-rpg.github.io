<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colisão RPG — Entrar</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#120b1f">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<!-- =====================================================================
     index.html — tela de login e cadastro
     Quem já entrou vai direto para o lobby (lobby.html).
     ===================================================================== -->
<main class="entrada">
  <div>
    <h1 class="palavra">Colisão<span>RPG</span></h1>
    <p class="lema">Crie seus sobreviventes, junte-se a uma campanha e monte o seu arsenal.</p>
  </div>

  <div class="cartao-login">
    <h2>Entrar</h2>
    <p class="nota">Primeira vez? Preencha também o nome e clique em Criar conta.</p>
    <form id="fLogin" class="g" novalidate>
      <div><label for="lEmail">E-mail</label><input type="email" id="lEmail" autocomplete="email" required></div>
      <div><label for="lSenha">Senha (mínimo 6 caracteres)</label><input type="password" id="lSenha" autocomplete="current-password" minlength="6" required></div>
      <div><label for="lNome">Nome (só para criar conta)</label><input type="text" id="lNome" autocomplete="name"></div>
      <div class="acoes">
        <button type="submit" class="btn" id="bEntrar">Entrar</button>
        <button type="button" class="btn vazado" id="bCriar">Criar conta</button>
      </div>
    </form>
    <p class="msg" id="lMsg" role="status">Conectando...</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="comum.js"></script>
<script>
(async function () {
  if (!sb) { aviso('#lMsg', 'Não foi possível carregar a biblioteca do Supabase. Verifique a internet.', 'ruim'); return; }

  // Já entrou antes? Vai direto para o lobby.
  const { data } = await sb.auth.getSession();
  if (data && data.session) { location.replace('lobby.html'); return; }
  aviso('#lMsg', 'Entre com seu e-mail e senha.');

  function campos() {
    const email = $('#lEmail').value.trim(), senha = $('#lSenha').value;
    if (!email || !senha) { aviso('#lMsg', 'Preencha o e-mail e a senha.', 'ruim'); return null; }
    if (senha.length < 6) { aviso('#lMsg', 'A senha precisa ter pelo menos 6 caracteres.', 'ruim'); return null; }
    return { email, senha };
  }
  function ocupado(sim) { $('#bEntrar').disabled = sim; $('#bCriar').disabled = sim; }

  // Entrar
  $('#fLogin').addEventListener('submit', async ev => {
    ev.preventDefault();
    const c = campos(); if (!c) return;
    ocupado(true); aviso('#lMsg', 'Entrando...');
    const r = await sb.auth.signInWithPassword({ email: c.email, password: c.senha });
    ocupado(false);
    if (r.error) { aviso('#lMsg', erroMsg(r.error), 'ruim'); return; }
    location.replace('lobby.html');
  });

  // Criar conta (o gatilho do banco cria o jogador com o nome digitado)
  $('#bCriar').addEventListener('click', async () => {
    const c = campos(); if (!c) return;
    ocupado(true); aviso('#lMsg', 'Criando conta...');
    const r = await sb.auth.signUp({ email: c.email, password: c.senha, options: { data: { nome: $('#lNome').value.trim() } } });
    ocupado(false);
    if (r.error) { aviso('#lMsg', erroMsg(r.error), 'ruim'); return; }
    if (r.data.session) { location.replace('lobby.html'); return; }
    // Sem sessão = o projeto exige confirmação por e-mail
    aviso('#lMsg', 'Conta criada. Abra o link de confirmação que chegou em ' + c.email + ' e depois clique em Entrar.', 'bom');
  });
})();
</script>
</body>
</html>
